name: Garnet Runtime Visibility

on:
  push:
    branches: ['main', 'record-base/**']
  pull_request:

permissions: {}

concurrency:
  group: garnet-install-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  dep-install:
    name: Root dependency install (recorded)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: hashFiles('bun.lock') != ''
        with:
          bun-version: '1.4.2'
      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2
      - name: Install root dependencies with lifecycle scripts
        env:
          npm_config_ignore_scripts: 'false'
        run: |
          if [ -f bun.lock ]; then
            bun install
          elif npm ci --ignore-scripts=false --foreground-scripts 2>&1 | tee "$RUNNER_TEMP/npm-ci.log"; then
            :
          else
            status=$?
            if grep -Eq 'can only install packages when|Missing: .* from lock file|Invalid: lock file' "$RUNNER_TEMP/npm-ci.log"; then
              npm install --ignore-scripts=false --foreground-scripts
            else
              exit "$status"
            fi
          fi
      - name: Let sensor settle
        if: always()
        run: sleep 30
